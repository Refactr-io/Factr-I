name: probe-spawn
on:
  push:
    branches: ['release/0.0.14']
    paths: ['.github/workflows/probe-spawn.yml']
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: launcher with spaces in the path
        shell: bash
        run: |
          mkdir -p "probe dir/with space" && cd "probe dir/with space"
          cat > h.ps1 <<'PS'
          param([string]$ConfigFile)
          $cfg = Get-Content -Raw -Encoding UTF8 -LiteralPath $ConfigFile | ConvertFrom-Json
          Start-Sleep -Seconds 2
          Set-Content -LiteralPath $cfg.Out -Value ("ran " + $cfg.Name)
          PS
          cat > child.mjs <<'JS'
          import { spawn } from 'node:child_process'
          import fs from 'node:fs'
          import path from 'node:path'
          const dir = process.cwd()
          const out = path.join(dir, 'out.txt')
          fs.writeFileSync(path.join(dir, 'cfg.json'), JSON.stringify({ Out: out, Name: 'João Smith' }))
          fs.writeFileSync(
            path.join(dir, 'launch.cmd'),
            '@echo off\r\nstart "" /B powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -WindowStyle Hidden -File "%~dp0h.ps1" -ConfigFile "%~dp0cfg.json"\r\n'
          )
          const c = spawn('cmd.exe', ['/c', path.join(dir, 'launch.cmd')], { detached: true, stdio: 'ignore', windowsHide: true })
          c.on('error', e => console.log('spawn error', e.message))
          c.unref()
          setTimeout(() => process.exit(0), 300)
          JS
          node child.mjs
          sleep 10
          if [ -f out.txt ]; then echo "LAUNCHER: RAN: $(cat out.txt)"; else echo "LAUNCHER: DID NOT RUN"; fi
