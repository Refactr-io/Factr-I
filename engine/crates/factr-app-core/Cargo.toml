[package]
name = "factr-app-core"
version = "0.1.0"
edition = "2024"
publish = false

# Application core for factr: all non-presentation modules (server, agent,
# provider, auth, session, tool, config, etc.) extracted out of the monolithic
# root `factr` crate so they compile as a separate rustc unit. The root `factr`
# crate (cli + tui + bin) re-exports this crate's modules via `pub use
# factr_app_core::*`, preserving every existing `crate::<module>` path.

[lib]
name = "factr_app_core"
path = "src/lib.rs"

[dependencies]
# NOTE: the jemalloc allocator stats live in `factr-base` (process_memory) and

# Async runtime
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# CLI

# File operations
glob = "0.3"
ignore = "0.4"
similar = "2"            # diffing for edits

# Utilities
dirs = "5"               # home directory
anyhow = "1"
libc = "0.2"             # Unix system calls (flock)
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
urlencoding = "2"        # URL encoding for web search
uuid = { version = "1", features = ["v4", "v5"] }

factr-harness-api = { path = "../factr-harness-api" }
factr-import-core = { path = "../factr-import-core" }

# OAuth
base64 = "0.22"
sha2 = "0.10"
rand = "0.9.3"
url = "2"
open = "5"               # Open URLs in browser
factr-agent-runtime = { path = "../factr-agent-runtime" }
factr-provider-core = { path = "../factr-provider-core" }
factr-schema-dialect = { path = "../factr-schema-dialect" }
# NOTE: factr-app-core does NOT depend on any factr-tui-* crate. They were
# unused dead dependency edges here (the TUI declares them itself). Removing
# them stops a factr-tui-* edit from cascading a recompile through app-core.

# Streaming
tokio-stream = "0.1"

# TUI
crossterm = { version = "0.29", features = ["event-stream"] }

# Markdown & syntax highlighting
unicode-width = "0.2"   # Unicode character display width

# PDF parsing (behind feature flag)
factr-pdf = { path = "../factr-pdf", optional = true }
factr-build-support = { path = "../factr-build-support" }
factr-build-meta = { path = "../factr-build-meta" }

# Foundational layer (provider, auth, config, session, message, memory, ...).
# Re-exported via `pub use factr_base::*` in lib.rs. default-features=false so
# this crate controls factr-base's optional features (see [features] below).
factr-base = { path = "../factr-base", default-features = false }
factr-command-risk = { path = "../factr-command-risk" }
factr-core = { path = "../factr-core" }
factr-message-types = { path = "../factr-message-types" }
factr-plan = { path = "../factr-plan" }
factr-swarm-core = { path = "../factr-swarm-core" }
factr-selfdev-types = { path = "../factr-selfdev-types" }
factr-session-types = { path = "../factr-session-types" }
factr-task-types = { path = "../factr-task-types" }
factr-tool-core = { path = "../factr-tool-core" }
factr-learn = { path = "../factr-learn" }
factr-tool-types = { path = "../factr-tool-types" }

# Archive extraction (for auto-update)
flate2 = "1"
tar = "0.4"
tempfile = "3"

[features]
default = ["pdf", "bedrock"]
# jemalloc allocator stats live in factr-base (process_memory); forward there.
jemalloc = ["factr-base/jemalloc"]
jemalloc-prof = ["factr-base/jemalloc-prof"]
# live AWS Bedrock support lives in factr-base (provider/bedrock); forward there.
bedrock = ["factr-base/bedrock"]
# PDF text extraction lives in this crate (tool/read.rs).
pdf = ["dep:factr-pdf"]
# Compiles this crate's test-only helpers/accessors (e.g. the
# ExternalAuthReviewCandidate read accessors) as `pub` and forwards
# factr-base's `test-support` so downstream crates' test targets can reach the
# whole stack's helpers. Never enabled in normal (non-test) builds.
test-support = ["factr-base/test-support"]

[dev-dependencies]
# Used by async streaming tests (ambient/runner_tests, server/client_actions_tests).
async-stream = "0.3"
# Enables factr-base's test-support helpers (storage::lock_test_env,
# auth::test_sandbox, bus::reset_models_updated_publish_state_for_tests) for
# *this* crate's own test target. Feature unification applies this only to
# test/bench/example builds, not to a normal `cargo build`.
factr-base = { path = "../factr-base", default-features = false, features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Native desktop control for the `macos_computer_use` tool (synthetic mouse/keyboard
# events, cursor positioning, display bounds). `highsierra` enables the
# CGEventCreateScrollWheelEvent2 binding used for scroll.
core-graphics = { version = "0.23", features = ["highsierra"] }
