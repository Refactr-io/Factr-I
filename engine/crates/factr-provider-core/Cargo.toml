[package]
name = "factr-provider-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "factr_provider_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
httpdate = "1"
factr-logging = { path = "../factr-logging" }
factr-schema-dialect = { path = "../factr-schema-dialect" }
factr-message-types = { path = "../factr-message-types" }
factr-usage-types = { path = "../factr-usage-types" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9.3"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt"] }
