[package]
name = "factr-tool-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "factr_tool_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
factr-agent-runtime = { path = "../factr-agent-runtime" }
factr-message-types = { path = "../factr-message-types" }
factr-tool-types = { path = "../factr-tool-types" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
