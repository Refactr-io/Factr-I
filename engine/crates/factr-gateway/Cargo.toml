[package]
name = "factr-gateway"
version = "0.1.0"
edition = "2024"
publish = false
description = "Factr tui_gateway-compatible HTTP/WebSocket front end for the factr harness API"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
httparse = "1"
libc = "0.2"
factr-base = { path = "../factr-base" }
factr-build-meta = { path = "../factr-build-meta" }
factr-app-core = { path = "../factr-app-core" }
factr-command-risk = { path = "../factr-command-risk" }
factr-pdf = { path = "../factr-pdf" }
base64 = "0.22"
fancy-regex = "0.18"
factr-harness-api-server = { path = "../factr-harness-api-server" }
factr-learn = { path = "../factr-learn" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
factr-provider-core = { path = "../factr-provider-core" }
serde_json = "1"
serde_yaml = "0.9"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time", "process"] }
tokio-tungstenite = "0.24"

[dev-dependencies]
factr-provider-anthropic-runtime = { path = "../factr-provider-anthropic-runtime" }
factr-provider-openrouter-runtime = { path = "../factr-provider-openrouter-runtime" }
jsonschema = { version = "0.49", default-features = false }
factr-base = { path = "../factr-base", features = ["test-support"] }
