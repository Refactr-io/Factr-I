[package]
name = "factr-provider-gemini-runtime"
version = "0.1.0"
edition = "2024"
description = "Gemini provider runtime (Developer API key) for factr, kept downstream of factr-base so provider edits do not rebuild the app spine"

[lib]
name = "factr_provider_gemini_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
# default-features = false: the top-level binary decides heavy optional base
# features (bedrock). Runtime crates must not re-enable them via
# feature unification, or --no-default-features release targets break.
factr-base = { path = "../factr-base", default-features = false }
factr-message-types = { path = "../factr-message-types" }
factr-provider-core = { path = "../factr-provider-core" }
factr-provider-gemini = { path = "../factr-provider-gemini" }
factr-schema-dialect = { path = "../factr-schema-dialect" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
factr-provider-anthropic = { path = "../factr-provider-anthropic" }
factr-provider-openai = { path = "../factr-provider-openai" }
factr-provider-openrouter = { path = "../factr-provider-openrouter" }
serde = { version = "1", features = ["derive"] }
# The migrated gemini tests use factr-base's test-env sandbox (lock_test_env).
factr-base = { path = "../factr-base", default-features = false, features = ["test-support"] }
tempfile = "3"
