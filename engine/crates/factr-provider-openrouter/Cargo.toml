[package]
name = "factr-provider-openrouter"
version = "0.1.0"
edition = "2024"

[dependencies]
factr-schema-dialect = { path = "../factr-schema-dialect" }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
futures = "0.3"
factr-core = { path = "../factr-core" }
factr-logging = { path = "../factr-logging" }
factr-provider-core = { path = "../factr-provider-core" }
factr-message-types = { path = "../factr-message-types" }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
