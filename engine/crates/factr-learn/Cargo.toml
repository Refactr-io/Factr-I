[package]
name = "factr-learn"
version = "0.1.0"
edition = "2024"
publish = false
description = "factr-learn-style recursive REPL and continual harness for the factr engine"

[dependencies]
anyhow = "1"
libc = "0.2"
chrono = "0.4"
factr-base = { path = "../factr-base" }
factr-storage = { path = "../factr-storage" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "process", "io-util", "sync", "time", "rt", "macros"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
